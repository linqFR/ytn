name: Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - ".changeset/**"
      - "packages/dna/package.json"
      - "packages/schvalid/package.json"
      - "packages/query-builder/package.json"
      - "packages/cli/package.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect pending changesets
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for pending changesets
        id: check
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: Version (changelog only)
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install dependencies
        run: npm install

      - name: Configure git for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create/Update Release Pull Request
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

  publish:
    name: Build, Test & Publish
    needs: detect
    if: needs.detect.outputs.pending == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Test public packages
        run: |
          npm test -w @ytrynot/dna
          npm test -w @ytrynot/schvalid
          npm test -w @ytrynot/qb
          npm test -w @ytrynot/cli

      - name: Configure git for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: npm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
